name: Create Tag and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (required, e.g. v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false
      npm_only:
        description: "Skip GoReleaser and publish npm packages from an existing GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-tag:
    name: Create Git Tag
    if: github.event_name != 'push' && !inputs.npm_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists, skipping creation."
          else
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

  release:
    name: GoReleaser Release
    needs: create-tag
    if: ${{ always() && !cancelled() && !inputs.npm_only && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Go from go.mod
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GOVERSION: ${{ steps.setup-go.outputs.go-version }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Apply release flags
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --draft=${{ inputs.draft }} \
            --prerelease=${{ inputs.prerelease }}

  npm:
    name: Publish npm packages
    needs: release
    if: ${{ always() && !cancelled() && (needs.release.result == 'success' || (inputs.npm_only && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      NPM_DIST_TAG: ${{ inputs.prerelease && 'next' || 'latest' }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check NPM_TOKEN
        id: check_token
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not configured; skipping npm publish."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download release archives
        if: steps.check_token.outputs.has_token == 'true'
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern 'malikclaw_*.tar.gz' \
            --pattern 'malikclaw_*.zip' \
            --dir dist
          ls -l dist

      - name: Build npm packages from archives
        if: steps.check_token.outputs.has_token == 'true'
        shell: bash
        run: node npm/scripts/build-npm-packages.js --version "${RELEASE_TAG#v}" --dir dist

      - name: Verify packaging consistency
        shell: bash
        run: node npm/scripts/verify.js

      - name: Publish platform packages (before the wrapper)
        if: steps.check_token.outputs.has_token == 'true'
        shell: bash
        run: |
          for pkg in ./npm/platforms/*/; do
            echo "::group::publish ${pkg}"
            npm publish "${pkg}" --access public --provenance --tag "${NPM_DIST_TAG}"
            echo "::endgroup::"
          done

      - name: Publish malikclaw wrapper (last, so it never points at unpublished packages)
        if: steps.check_token.outputs.has_token == 'true'
        shell: bash
        run: npm publish ./npm/cli --access public --provenance --tag "${NPM_DIST_TAG}"
