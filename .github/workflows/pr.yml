name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Generate, Lint, Vulnerability Scan, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Run Odoo MCP tool tests
        run: pytest scripts/mcp_servers/test_odoo_server.py

      - name: Run go generate
        run: go generate ./...

      - name: Run go vet
        run: go vet ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          verify: true
          args: --timeout=5m

      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

      - name: Run go test
        run: go test -race -timeout=10m ./...
