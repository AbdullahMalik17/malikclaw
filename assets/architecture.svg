<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="20" width="960" height="580" rx="12" fill="none" stroke="url(#accent-grad)" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Title Header -->
  <text x="500" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">
    MALIKCLAW 🦅 ARCHITECTURE DIRECTORY &amp; ENGINE LOOP
  </text>
  <text x="500" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Production-Grade • &lt;10MB RAM • &lt;1s Boot • $10 Hardware • Omnichannel Autonomous Agent
  </text>

  <!-- Layer 1: Ingestion / Channels Gateway -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="920" height="95" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="130" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. OMNICHANNEL GATEWAY &amp; USER INTERFACES (pkg/channels)</text>
    
    <rect x="60" y="145" width="130" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="125" y="170" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Telegram / Discord</text>
    
    <rect x="205" y="145" width="130" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="270" y="170" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">WhatsApp / Matrix</text>

    <rect x="350" y="145" width="130" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="415" y="170" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Web UI / Desktop</text>

    <rect x="495" y="145" width="140" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="565" y="170" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">TikTok / LinkedIn / X</text>

    <rect x="650" y="145" width="140" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="720" y="170" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">WeCom / QQ / Feishu</text>

    <rect x="805" y="145" width="135" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="872" y="170" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">MaixCam / Termux</text>
  </g>

  <!-- Connectors -->
  <path d="M 500 200 L 500 230" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Layer 2: Core Agent Loop (pkg/agent/agentloop) -->
  <g filter="url(#shadow)">
    <rect x="40" y="230" width="920" height="170" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="2"/>
    <text x="60" y="258" font-family="sans-serif" font-size="15" font-weight="700" fill="#818cf8">2. RESILIENT AGENTIC ENGINE LOOP (pkg/agent/agentloop)</text>

    <g transform="translate(60, 275)">
      <rect x="0" y="0" width="160" height="105" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="80" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">1. PLANNER</text>
      <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Goal Decomposition</text>
      <text x="80" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Subtask Graph</text>
    </g>

    <text x="235" y="330" font-family="sans-serif" font-size="18" fill="#818cf8">➔</text>

    <g transform="translate(250, 275)">
      <rect x="0" y="0" width="160" height="105" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="80" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">2. EXECUTOR</text>
      <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Sandboxed Tools</text>
      <text x="80" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Retry &amp; Circuit Breaker</text>
    </g>

    <text x="425" y="330" font-family="sans-serif" font-size="18" fill="#818cf8">➔</text>

    <g transform="translate(440, 275)">
      <rect x="0" y="0" width="160" height="105" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
      <text x="80" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">3. OBSERVER</text>
      <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Result Capture</text>
      <text x="80" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Confidence Score</text>
    </g>

    <text x="615" y="330" font-family="sans-serif" font-size="18" fill="#818cf8">➔</text>

    <g transform="translate(630, 275)">
      <rect x="0" y="0" width="160" height="105" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="80" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">4. REFLECTOR</text>
      <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Lessons Learned</text>
      <text x="80" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Self-Correction</text>
    </g>

    <text x="805" y="330" font-family="sans-serif" font-size="18" fill="#818cf8">➔</text>

    <g transform="translate(820, 275)">
      <rect x="0" y="0" width="120" height="105" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="60" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">5. MEMORY</text>
      <text x="60" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Markdown Logs</text>
      <text x="60" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">SOUL / USER</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 500 400 L 500 425" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Layer 3: Providers & Self-Evolution -->
  <g filter="url(#shadow)">
    <rect x="40" y="425" width="445" height="160" rx="10" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="60" y="452" font-family="sans-serif" font-size="14" font-weight="700" fill="#c084fc">3. PROTOCOL PROVIDERS (pkg/providers)</text>
    <text x="60" y="475" font-family="sans-serif" font-size="12" fill="#cbd5e1">• OpenAI / Anthropic / Google Antigravity</text>
    <text x="60" y="495" font-family="sans-serif" font-size="12" fill="#cbd5e1">• DeepSeek / Ollama Local / Zhipu GLM</text>
    <text x="60" y="515" font-family="sans-serif" font-size="12" fill="#cbd5e1">• OpenRouter / Groq / ModelScope</text>
    <text x="60" y="535" font-family="sans-serif" font-size="12" fill="#cbd5e1">• High Availability Smart Model Fallbacks</text>
    <text x="60" y="555" font-family="sans-serif" font-size="12" fill="#38bdf8">⚡ Native Streaming &amp; Context Caching</text>

    <rect x="515" y="425" width="445" height="160" rx="10" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="535" y="452" font-family="sans-serif" font-size="14" font-weight="700" fill="#f43f5e">4. GUARDIAN &amp; HARDWARE RUNTIME</text>
    <text x="535" y="475" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Self-Evolution Code Patching (Guardian)</text>
    <text x="535" y="495" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Android ADB Phone Control &amp; Termux</text>
    <text x="535" y="515" font-family="sans-serif" font-size="12" fill="#cbd5e1">• $10 Hardware: Orange Pi, Raspberry Pi, RISC-V</text>
    <text x="535" y="535" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Docker &amp; Single Static Binary Build</text>
    <text x="535" y="555" font-family="sans-serif" font-size="12" fill="#4ade80">🛡️ 100% Privacy &amp; Directory Sandboxing</text>
  </g>
</svg>
